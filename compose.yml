services:
  ctr-psx-server:
    build: .
    ports:
      # Change this port to whatever you like
      - "64001:64001/udp"
    # This host's settings: copy octr-server.env.example to octr-server.env
    # and fill it in first (git-ignored; never commit it).
    env_file: octr-server.env
    restart: unless-stopped
    tty: true
